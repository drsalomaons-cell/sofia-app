name: Flutter verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/sofia-voice-lounge-8-seats]

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare local environment placeholder
        run: touch .env

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub
